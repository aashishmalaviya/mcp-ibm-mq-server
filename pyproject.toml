[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-ibm-mq-server"
version = "0.5.0"
description = "Governed Model Context Protocol (MCP) server that lets AI agents read and send IBM MQ messages safely."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Aashish Malaviya" }]
requires-python = ">=3.10"
dependencies = ["mcp>=2.0"]

[project.optional-dependencies]
mq = ["pymqi>=1.12"]
dev = ["pytest>=8", "pyyaml>=6", "pyjwt[crypto]>=2.8"]
auth = ["pyjwt[crypto]>=2.8"]
evals = ["pyyaml>=6", "anthropic>=0.40", "pyjwt[crypto]>=2.8"]

[project.scripts]
mcp-ibm-mq-server = "mcp_ibm_mq.server:main"
mcp-ibm-mq-approvals = "mcp_ibm_mq.approve_cli:main"
mcp-ibm-mq-trace = "mcp_ibm_mq.trace_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_ibm_mq"]

[tool.pytest.ini_options]
pythonpath = ["src", "evals"]
